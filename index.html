<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>픽셀 치즈 백과</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
:root{
  --bg:#f5efe2; --panel:#fffaf0; --panel2:#efe6d3; --ink:#2e2925; --muted:#7d7266;
  --line:#5e5248; --line-soft:#c2b4a0; --dot:#e6dccb; --accent:#d8b45c; --accent-soft:#f1dfa8; --shadow:#e0d6c3;
  --px:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1f1c19; --panel:#2a2622; --panel2:#35302a; --ink:#efe6d6; --muted:#a89c8c;
    --line:#8a7c6e; --line-soft:#5a5047; --dot:#26221e; --accent:#d8b45c; --accent-soft:#4a3f26; --shadow:#171513;
  }
}
:root[data-theme="dark"]{
  --bg:#1f1c19; --panel:#2a2622; --panel2:#35302a; --ink:#efe6d6; --muted:#a89c8c;
  --line:#8a7c6e; --line-soft:#5a5047; --dot:#26221e; --accent:#d8b45c; --accent-soft:#4a3f26; --shadow:#171513;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Galmuri11","Galmuri9",ui-monospace,"Apple SD Gothic Neo","Malgun Gothic",monospace;
  font-size:14px; line-height:1.75; -webkit-font-smoothing:none;
  background-image:radial-gradient(var(--dot) 1px, transparent 1px);
  background-size:16px 16px;
}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
/* pixel box: stepped corners via box-shadow */
.px{
  background:var(--panel); position:relative;
  box-shadow:
    0 calc(var(--px)*-1) 0 0 var(--line),
    0 var(--px) 0 0 var(--line),
    calc(var(--px)*-1) 0 0 0 var(--line),
    var(--px) 0 0 0 var(--line),
    var(--px) var(--px) 0 var(--px) var(--shadow);
}
header.top{padding:40px 0 24px}
.brand{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.brand canvas{width:96px;height:96px}
h1{font-family:"Galmuri14","Galmuri11",monospace;font-size:30px;margin:0;letter-spacing:1px;line-height:1.3}
.sub{color:var(--muted);margin:4px 0 0}
nav.tabs{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 8px}
nav.tabs a{
  color:var(--ink);text-decoration:none;padding:6px 14px;background:var(--panel);
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line);
}
nav.tabs a:hover{background:var(--accent-soft)}
#theme{margin-left:auto;cursor:pointer;font:inherit;color:var(--ink);background:var(--panel);border:0;padding:6px 12px;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line);}
section{margin:44px 0}
h2{font-family:"Galmuri14","Galmuri11",monospace;font-size:20px;margin:0 0 18px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:12px;height:12px;background:var(--accent);box-shadow:3px 3px 0 var(--line)}
.lead{padding:20px 22px;margin-bottom:28px}
/* timeline */
.timeline{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.tl{padding:14px 16px}
.tl .y{display:inline-block;background:var(--accent-soft);padding:0 6px;font-size:12px}
.tl b{display:block;margin:6px 0 2px}
.tl p{margin:0;color:var(--muted);font-size:13px}
.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));counter-reset:s}
.step{padding:14px;counter-increment:s}
.step::before{content:counter(s,decimal-leading-zero);font-size:22px;color:var(--accent);display:block;line-height:1}
.step b{display:block;margin:6px 0 2px}
.step p{margin:0;font-size:13px;color:var(--muted)}
.types{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.type{padding:14px}
.type small{color:var(--muted)}
/* toolbar */
.toolbar{padding:16px;display:grid;gap:12px;margin-bottom:28px}
.search{display:flex;gap:10px;align-items:center}
.search input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--panel2);border:0;padding:10px 12px;outline:none;
  box-shadow:inset 3px 3px 0 var(--shadow)}
.search input:focus{box-shadow:inset 3px 3px 0 var(--shadow),0 0 0 3px var(--accent)}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow .lbl{color:var(--muted);font-size:12px;width:44px}
.chip{font:inherit;font-size:13px;cursor:pointer;color:var(--ink);background:var(--panel2);border:0;padding:3px 10px;
  box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--accent);color:#2e2925}
.count{color:var(--muted);font-size:12px}
/* cards */
.grid{display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{padding:16px;cursor:pointer;transition:transform .08s steps(2)}
.card:hover,.card:focus-visible{transform:translate(-2px,-2px);outline:none;background:var(--accent-soft)}
.card .ic{display:flex;justify-content:center;background:var(--panel2);padding:10px 0;margin-bottom:12px}
.card canvas{width:96px;height:96px}
.card h3{margin:0;font-size:16px;font-family:"Galmuri14","Galmuri11",monospace;font-weight:normal}
.card .en{color:var(--muted);font-size:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;padding:0 6px;background:transparent;color:var(--muted);box-shadow:0 0 0 2px var(--line-soft)}
.meter{display:flex;gap:3px;margin-top:10px;align-items:center;font-size:11px;color:var(--muted)}
.meter i{width:10px;height:10px;background:var(--panel2);box-shadow:0 0 0 2px var(--line-soft)}
.meter i.on{background:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px}
/* modal */
dialog{border:0;padding:0;background:transparent;max-width:min(720px,calc(100vw - 32px));width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(30,26,22,.55)}
.mbox{padding:24px;max-height:85vh;overflow:auto}
.mhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.mhead canvas{width:128px;height:128px;background:var(--panel2);padding:8px}
.mhead h3{margin:0;font-size:24px;font-family:"Galmuri14","Galmuri11",monospace;font-weight:normal}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:18px 0}
.fact{background:var(--panel2);padding:8px 10px}
.fact small{display:block;color:var(--muted);font-size:11px}
.mbox h4{margin:18px 0 4px;font-size:14px;color:var(--muted)}
.mbox p{margin:0}
.close{position:absolute;top:12px;right:14px;font:inherit;cursor:pointer;background:var(--panel2);color:var(--ink);border:0;width:32px;height:32px;
  box-shadow:0 0 0 2px var(--line)}
.mapbox{padding:16px}
.mapwrap{position:relative;width:100%}
.mapwrap canvas{width:100%;height:auto;display:block}
.pin{position:absolute;transform:translate(-50%,-100%);font:inherit;font-size:12px;cursor:pointer;border:0;padding:1px 6px;white-space:nowrap;
  background:var(--panel);color:var(--ink);box-shadow:0 0 0 2px var(--line-soft)}
.pin.main{box-shadow:0 0 0 2px var(--line)}
.pin::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-3px;width:6px;height:4px;background:var(--line)}
.pin b{color:var(--muted);font-weight:normal;margin-left:3px}
.pin:hover,.pin.on{background:var(--accent);color:#2e2925}
.pin:hover b,.pin.on b{color:#2e2925}
.pin.edge{transform:translate(0,-50%);box-shadow:0 0 0 2px var(--line);opacity:.85}
.pin.edge::after{display:none}
.pin.main{font-size:15px;padding:3px 10px;background:var(--accent);color:#2e2925;z-index:2}
.pin.main b{color:#2e2925}
.maphint{margin:10px 0 0;color:var(--muted);font-size:12px}
@media (max-width:640px){.pin{font-size:10px;padding:0 3px}.pin b{display:none}}
.tips{padding:16px 22px}
.tips li{margin:6px 0}
footer{color:var(--muted);text-align:center;padding:30px 0 50px;font-size:12px}
@media (max-width:600px){ nav.tabs{flex-wrap:nowrap;overflow-x:auto;padding:4px;gap:10px} nav.tabs a,#theme{white-space:nowrap;flex:none} }
@media (max-width:520px){ h1{font-size:22px} .brand canvas{width:64px;height:64px} #theme{margin-left:0} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <canvas id="logo" width="16" height="16"></canvas>
      <div>
        <h1>픽셀 치즈 백과</h1>
        <p class="sub">세계의 치즈 28종을 한 칸 한 칸 기록한 작은 도감</p>
      </div>
    </div>
    <nav class="tabs">
      <a href="#about">치즈란?</a>
      <a href="#history">역사</a>
      <a href="#make">만드는 법</a>
      <a href="#map">치즈 지도</a>
      <a href="#dex">치즈 도감</a>
      <a href="#tips">보관 팁</a>
      <button id="theme" type="button">◐ 테마</button>
    </nav>
  </header>

  <section id="about">
    <h2>치즈란?</h2>
    <div class="px lead" id="lead"></div>
    <div class="types" id="types"></div>
  </section>

  <section id="history">
    <h2>치즈의 역사</h2>
    <div class="timeline" id="timeline"></div>
  </section>

  <section id="make">
    <h2>치즈 만드는 과정</h2>
    <div class="steps" id="steps"></div>
  </section>

  <section id="map">
    <h2>치즈 지도</h2>
    <div class="px mapbox">
      <div class="mapwrap" id="mapwrap"><canvas id="mapcv" width="98" height="54" role="img" aria-label="치즈 원산지 픽셀 지도"></canvas></div>
      <p class="maphint">치즈의 나라 프랑스를 중심으로 — 핀을 누르면 그 나라의 치즈만 도감에 표시돼요.</p>
    </div>
  </section>

  <section id="dex">
    <h2>치즈 도감</h2>
    <div class="px toolbar">
      <div class="search">
        <span aria-hidden="true">⌕</span>
        <input id="q" type="search" placeholder="이름, 나라, 맛으로 검색 (예: 프랑스, 견과향)" aria-label="치즈 검색">
        <span class="count" id="count"></span>
      </div>
      <div class="frow" data-key="milk"><span class="lbl">원유</span></div>
      <div class="frow" data-key="texture"><span class="lbl">질감</span></div>
      <div class="frow" data-key="country"><span class="lbl">나라</span></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="tips">
    <h2>보관 · 서빙 팁</h2>
    <ul class="px tips" id="tiplist"></ul>
  </section>

  <footer>■ 픽셀 치즈 백과 · 모든 아이콘은 16×16 픽셀로 그렸습니다 ■</footer>
</div>

<dialog id="modal"><div class="px mbox" id="mbox"></div></dialog>

function draw(cv,c){

  const rind=L.rind||c.rind||"#e3d3a8", paste=L.paste||c.paste||"#f2dc9a";

function inPoly(x,y,P){let r=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))r=!r}return r}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function drawMap(sel){
  const cv=$("#mapcv"),g=cv.getContext("2d");
  const sea=cssv("--panel2"),land=cssv("--shadow"),hot=cssv("--accent-soft"),on=cssv("--accent"),line=cssv("--line"),grid=cssv("--bg");
  g.fillStyle=sea;g.fillRect(0,0,MAP.w,MAP.h);
  g.fillStyle=grid;for(let y=0;y<MAP.h;y+=6)for(let x=(y/6%2)*3;x<MAP.w;x+=6)g.fillRect(x,y,1,1);
  const owner=(x,y)=>{const lon=MAP.lon0+(x+.5)*MAP.step,lat=MAP.lat1-(y+.5)*MAP.step;for(const L of LAND)if(inPoly(lon,lat,L.p))return L.c;return null};
  const O=[];for(let y=0;y<MAP.h;y++){O[y]=[];for(let x=0;x<MAP.w;x++)O[y][x]=owner(x,y)}
  // inset US
  for(let y=0;y<MAP.h;y++)for(let x=0;x<MAP.w;x++){const c=O[y][x];if(c===null)continue;
    g.fillStyle=c&&c===sel?on:c&&COUNTRIES[c]?hot:land;g.fillRect(x,y,1,1);
    // outline where neighbor differs
    const n=[[1,0],[0,1]];for(const[dx,dy]of n){const o=(O[y+dy]||[])[x+dx];if(o!==undefined&&o!==c&&o!==null&&c!==""&&COUNTRIES[c]){}}
  }
  // coastline / borders
  g.fillStyle=line;
  for(let y=0;y<MAP.h;y++)for(let x=0;x<MAP.w;x++){const c=O[y][x];if(c===null)continue;
    const up=(O[y-1]||[])[x],lf=O[y][x-1];
    if(up===null||up===undefined&&y===0){} 
    if(y>0&&up===null)g.fillRect(x,y,1,1);
    else if(lf===null&&x>0)g.fillRect(x,y,1,1);
    else if(y>0&&up!==c&&up!==null&&(COUNTRIES[c]||COUNTRIES[up])){g.globalAlpha=.35;g.fillRect(x,y,1,1);g.globalAlpha=1}
    else if(x>0&&lf!==c&&lf!==null&&(COUNTRIES[c]||COUNTRIES[lf])){g.globalAlpha=.35;g.fillRect(x,y,1,1);g.globalAlpha=1}
  }
  // inset frame
}
